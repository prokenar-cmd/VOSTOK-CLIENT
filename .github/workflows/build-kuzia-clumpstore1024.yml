name: Build Kuzia + Gold Crime ClumpStore 1024

on:
  push:
    branches:
      - experiment-kuzia-goldcrime-cdstream-trace
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout VOSTOK experiment branch
        uses: actions/checkout@v4

      - name: Download exact Run 17 patched source
        uses: actions/download-artifact@v4
        with:
          name: VOSTOK_KUZIA_CRIME_VEHICLESTORE1024_SOURCE
          path: kuzia
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: prokenar-cmd/VOSTOK-CLIENT
          run-id: 35087294577

      - name: Verify Run 17 source baseline
        shell: bash
        run: |
          set -euxo pipefail
          test -f kuzia/VOSTOK_SOURCE_STATE.md
          test -f kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'NUM_PED_MODEL_INFOS = 512' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'NUM_VEHICLE_MODEL_INFOS = 1024' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'VOSTOK ModelCD:' kuzia/app/src/main/cpp/samp/game/Streaming.cpp
          grep -nF 'VOSTOK PedStore extended:' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp
          grep -nF 'VOSTOK VehicleStore extended:' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp

      - name: Expand clump model store to 1024
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          h = Path('kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h')
          s = h.read_text(encoding='utf-8')

          if '#include "ClumpModelInfo.h"' not in s:
              marker = '#include "AtomicModelInfo.h"\n'
              if marker not in s:
                  raise SystemExit('AtomicModelInfo include marker not found')
              s = s.replace(marker, marker + '#include "ClumpModelInfo.h"\n', 1)

          marker = '    static inline CStore<CAtomicModelInfo, 20000> ms_atomicModelInfoStore;\n\n'
          block = '''    static constexpr int32 NUM_CLUMP_MODEL_INFOS = 1024;\n    static inline CStore<CClumpModelInfo, NUM_CLUMP_MODEL_INFOS> ms_clumpModelInfoStore;\n\n'''
          if 'NUM_CLUMP_MODEL_INFOS' not in s:
              if marker not in s:
                  raise SystemExit('Atomic store marker not found')
              s = s.replace(marker, marker + block, 1)

          decl_marker = '    static CAtomicModelInfo *AddAtomicModel(int index);\n'
          if 'AddClumpModel' not in s:
              if decl_marker not in s:
                  raise SystemExit('AddAtomicModel declaration marker not found')
              s = s.replace(decl_marker, decl_marker + '    static CClumpModelInfo *AddClumpModel(int index);\n', 1)

          h.write_text(s, encoding='utf-8')

          cpp = Path('kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp')
          s = cpp.read_text(encoding='utf-8')

          if 'CModelInfo::AddClumpModel' not in s:
              marker = 'CVehicleModelInfo* CModelInfo::AddVehicleModel(int index)\n'
              if marker not in s:
                  raise SystemExit('AddVehicleModel insertion point not found')

              fn = '''CClumpModelInfo* CModelInfo::AddClumpModel(int index)\n{\n    const auto slot = CModelInfo::ms_clumpModelInfoStore.m_nCount;\n    if (slot >= 92) {\n        Log("VOSTOK ClumpStore extended: slot=%zu model=%d capacity=%d",\n            slot, index, CModelInfo::NUM_CLUMP_MODEL_INFOS);\n    }\n    if (slot >= CModelInfo::NUM_CLUMP_MODEL_INFOS) {\n        Log("VOSTOK ClumpStore OVERFLOW: slot=%zu model=%d capacity=%d",\n            slot, index, CModelInfo::NUM_CLUMP_MODEL_INFOS);\n        return nullptr;\n    }\n\n    auto& pInfo = CModelInfo::ms_clumpModelInfoStore.AddItem();\n\n    ((void(*)(CClumpModelInfo*))(g_libGTASA + 0x5304DC))(&pInfo); // CBaseModelInfo::CBaseModelInfo()\n    pInfo.vtable = g_libGTASA + 0x822590; // _ZTV15CClumpModelInfo + 0x10\n    pInfo.m_animFileName = nullptr;\n\n    ((void(*)(CClumpModelInfo*))(*(uintptr_t*)(pInfo.vtable + 0x1C*2)))(&pInfo);\n\n    CModelInfo::SetModelInfo(index, &pInfo);\n    return &pInfo;\n}\n\n'''
              s = s.replace(marker, fn + marker, 1)

          hook_marker = '    CHook::Redirect("_ZN10CModelInfo14AddAtomicModelEi", &CModelInfo::AddAtomicModel);\n'
          hook_line = '    CHook::Redirect("_ZN10CModelInfo13AddClumpModelEi", &CModelInfo::AddClumpModel);\n'
          if hook_line not in s:
              if hook_marker not in s:
                  raise SystemExit('ModelInfo hook marker not found')
              s = s.replace(hook_marker, hook_marker + hook_line, 1)

          cpp.write_text(s, encoding='utf-8')
          PY

          grep -nF 'NUM_CLUMP_MODEL_INFOS = 1024' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'VOSTOK ClumpStore extended:' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp
          grep -nF '_ZN10CModelInfo13AddClumpModelEi' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp

          cat >> kuzia/VOSTOK_SOURCE_STATE.md <<'EOF'

          ## ClumpStore 1024 experiment
          Runtime evidence from Run 17:
          - VehicleStore 1024 allowed CRIME's 635 vehicle entries to progress past the previous CModelInfo::GetModelInfo crash.
          - The next crash is SIGSEGV fault 0x38 exactly in libGame CModelInfo::AddClumpModel +0x34 (0x531d38), while dereferencing the virtual table of the next clump-store slot.
          - GTA 2.11 native ClumpStore starts at 0xB72B78 and native VehicleStore starts at 0xB74840.
          - The distance is 0x1CC8 = 7368 bytes, exactly sizeof(size_t) + 92 * sizeof(CClumpModelInfo) on ARM64 (8 + 92*80).
          - Therefore the native clump store capacity is exactly 92; slot 92 lands on the following VehicleStore count field, producing a null vtable and fault address 0x38.

          This experiment adds a VOSTOK-owned CStore<CClumpModelInfo, 1024>, redirects only CModelInfo::AddClumpModel to it, and logs slots >=92.
          ModelCD fix, PedStore 512, VehicleStore 1024, player PVR bridge and unified cache root remain preserved.
          This is NOT a MASTER promotion and requires device smoke.
          EOF

      - name: Add read-only CdStream diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          cp .github/diagnostics/CdStreamTrace.cpp kuzia/app/src/main/cpp/samp/CdStreamTrace.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kuzia/app/src/main/cpp/samp/game/hooks.cpp')
          s = p.read_text(encoding='utf-8')
          marker = 'void InjectHooks()\n{\n'
          assert s.count(marker) == 1
          s = s.replace(marker, 'void InstallCdStreamTrace();\n' + marker + '    InstallCdStreamTrace();\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK_KUZIA_CRIME_CDSTREAM_TRACE_SOURCE
          path: kuzia
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build ClumpStore-1024 APK
        working-directory: kuzia
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          rm -rf app/.cxx app/build/intermediates/cxx app/build/intermediates/merged_native_libs
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --rerun-tasks

      - name: Verify rebuilt libsamp
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find kuzia/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          unzip -p "$APK" lib/arm64-v8a/libsamp.so > /tmp/libsamp.so
          test -s /tmp/libsamp.so

          strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA_CRIME_TEST/' | head -20
          strings /tmp/libsamp.so | grep -F 'VOSTOK ModelCD: model='
          strings /tmp/libsamp.so | grep -F 'VOSTOK PedStore extended:'
          strings /tmp/libsamp.so | grep -F 'VOSTOK VehicleStore extended:'
          strings /tmp/libsamp.so | grep -F 'VOSTOK ClumpStore extended:'

          if strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA/'; then
            echo 'ERROR: rebuilt libsamp.so still contains legacy /storage/emulated/0/GTA/'
            exit 1
          fi

          strings /tmp/libsamp.so | grep -F 'VOSTOK_CDTRACE'
          sha256sum /tmp/libsamp.so "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_CDSTREAM_TRACE
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload rebuilt libsamp
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_CDSTREAM_TRACE_LIBSAMP
          path: /tmp/libsamp.so
          if-no-files-found: error
          retention-days: 7
