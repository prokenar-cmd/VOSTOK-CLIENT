name: Bootstrap Frozen VOSTOK Launcher

# Triggered to restore and permanently freeze the accepted Candidate 022 launcher binary.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-launcher.yml'

permissions:
  contents: write

env:
  APPROVED_SHA256: 8ede863d84340efc989af2fa35040d8df566c90e9c96fe7c2fede8aa8c6406e0
  SOURCE_ARTIFACT_ID: '10281815426'

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout current VOSTOK client orchestration
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore exact accepted launcher from Candidate 022 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c022 launcher/approved
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/c022-artifact.zip
          unzip -q /tmp/c022-artifact.zip -d /tmp/c022
          APK="$(find /tmp/c022 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ENTRY="$(unzip -Z1 "$APK" | grep -E '(^|/)vostok_launcher_reference\.jpg$' | head -n1)"
          test -n "$ENTRY"
          unzip -p "$APK" "$ENTRY" > launcher/approved/VOSTOK_LAUNCHER_BACKGROUND_CLEAN_019.jpg
          echo "${APPROVED_SHA256}  launcher/approved/VOSTOK_LAUNCHER_BACKGROUND_CLEAN_019.jpg" | sha256sum -c -
          test "$(stat -c%s launcher/approved/VOSTOK_LAUNCHER_BACKGROUND_CLEAN_019.jpg)" -gt 100000

      - name: Commit canonical binary into VOSTOK-CLIENT
        run: |
          set -euo pipefail
          rm -rf launcher/approved/app_asset_base64 launcher/approved/base64 || true
          git config user.name 'VOSTOK Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/approved/VOSTOK_LAUNCHER_BACKGROUND_CLEAN_019.jpg launcher/approved || true
          if git diff --cached --quiet; then
            echo 'Approved launcher already committed.'
            exit 0
          fi
          git commit -m 'VOSTOK: freeze exact approved launcher binary from Candidate 022'
          git push origin HEAD:main
