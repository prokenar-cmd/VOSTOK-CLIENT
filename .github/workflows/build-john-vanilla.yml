name: Build John GTA 2.11.311 Vanilla

on:
  push:
    branches:
      - experiment-john-vanilla
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout John source
        uses: actions/checkout@v4
        with:
          repository: JohnPeriaX/samp-mobile-2.11.311
          ref: 0df908fccfc26ac3ef54e004504b5b1f122362b1
          path: john
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: john/**/*.gradle*

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;26.2.11394342' \
            'cmake;3.22.1'

      - name: Patch connection to settings.ini
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('john/app/src/main/cpp/multiplayer/samp/main.cpp')
          text = main.read_text(encoding='utf-8')
          old = 'pNetGame = new CNetGame("gta-irz.com", 7777, "Luca_Runky", "");'
          new = '''if (!pSettings) {
                    FLog("Network init aborted: settings are unavailable");
                    return;
                }
                pNetGame = new CNetGame(
                        pSettings->Get().szHost,
                        pSettings->Get().iPort,
                        pSettings->Get().szNickName,
                        pSettings->Get().szPassword);'''
          if old not in text:
              raise SystemExit('Expected hard-coded John endpoint not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          assets = Path('john/app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)
          (assets / 'settings.ini').write_text('''[client]
          name=AndroidUser
          host=127.0.0.1
          port=7777
          password=
          version=0.3.7
          autoaim=false

          [debug]
          debug=false
          online=true

          [gui]
          Font=arial.ttf
          FontSize=30
          FontOutline=2
          androidkeyboard=false
          VoiceChatEnable=false
          fps=0
          ChatMaxMessages=6
          FPSLimit=60
          Dialog=true
          ''', encoding='utf-8')
          PY

          grep -n -A8 -B3 'pNetGame = new CNetGame' john/app/src/main/cpp/multiplayer/samp/main.cpp
          cat john/app/src/main/assets/settings.ini

      - name: Verify John source profile
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "compileSdk 36" john/app/build.gradle
          grep -q "targetSdk 36" john/app/build.gradle
          grep -q "abiFilters 'arm64-v8a'" john/app/build.gradle
          grep -q "ndkVersion '26.2.11394342'" john/app/build.gradle
          grep -q 'max-page-size=16384' john/app/src/main/cpp/multiplayer/CMakeLists.txt
          test -f john/app/src/main/jniLibs/arm64-v8a/libGame.so
          file john/app/src/main/jniLibs/arm64-v8a/libGame.so

      - name: Build debug APK
        working-directory: john
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Validate APK and native ABI
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find john/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK"
          sha256sum "$APK"

          rm -rf /tmp/john-apk
          mkdir -p /tmp/john-apk
          unzip -q "$APK" -d /tmp/john-apk

          test -f /tmp/john-apk/lib/arm64-v8a/libsamp.so
          test -f /tmp/john-apk/lib/arm64-v8a/libGame.so
          test ! -d /tmp/john-apk/lib/armeabi-v7a

          file /tmp/john-apk/lib/arm64-v8a/libsamp.so
          file /tmp/john-apk/lib/arm64-v8a/libGame.so
          readelf -h /tmp/john-apk/lib/arm64-v8a/libsamp.so | grep -E 'Class:|Machine:'
          readelf -lW /tmp/john-apk/lib/arm64-v8a/libsamp.so | grep -E 'LOAD|Align' | head -20

          strings /tmp/john-apk/lib/arm64-v8a/libsamp.so | grep -F 'gta-irz.com' && {
            echo 'ERROR: old hard-coded server survived native compilation'
            exit 1
          } || true

          cp "$APK" JOHN_VANILLA_ARM64_TEST.apk
          sha256sum JOHN_VANILLA_ARM64_TEST.apk > JOHN_VANILLA_ARM64_TEST.sha256

      - name: Upload John test APK
        uses: actions/upload-artifact@v4
        with:
          name: JOHN-VANILLA-ARM64-TEST
          path: |
            JOHN_VANILLA_ARM64_TEST.apk
            JOHN_VANILLA_ARM64_TEST.sha256
          if-no-files-found: error
          retention-days: 14
