name: Build Kuzia + Gold Crime Cache Test

on:
  push:
    branches:
      - experiment-kuzia-goldcrime-cache
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Kuzia GTA-2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          path: kuzia
          persist-credentials: false

      - name: Apply build and Gold Crime cache autodetect patches
        shell: bash
        run: |
          set -euxo pipefail

          # Upstream was developed on case-insensitive Windows; Linux CI exposes
          # two filename-case mismatches. These do not alter client logic.
          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' \
            kuzia/app/src/main/cpp/samp/gui/gui.h
          sed -i 's#"RGBA.h"#"rgba.h"#g' \
            kuzia/app/src/main/cpp/samp/game/rgba.cpp

          # Experimental locator: find a modern Gold Russia / Crime Mobile style
          # cache already downloaded by the official launcher. The old BlackRussia
          # cache is explicitly excluded so this A/B test cannot silently reuse it.
          cat > kuzia/app/src/main/java/com/gta/launcher/activity/CacheLocator.java <<'JAVA'
          package com.gta.launcher.activity;

          import android.content.Context;
          import java.io.File;
          import java.util.ArrayDeque;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          public final class CacheLocator {
              private static final String PREFS = "vostok_cache_test";
              private static final String KEY = "base_path";
              private static final String FALLBACK = "/storage/emulated/0/GTA";

              private CacheLocator() { }

              public static String getSelectedPath(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getString(KEY, FALLBACK);
              }

              public static File findAndSave(Context context) {
                  String[] preferred = new String[] {
                          "/storage/emulated/0/GoldRussia",
                          "/storage/emulated/0/Gold Russia",
                          "/storage/emulated/0/CrimeMobile",
                          "/storage/emulated/0/Crime Mobile",
                          "/storage/emulated/0/Crime",
                          "/storage/emulated/0/Rublevka",
                          "/storage/emulated/0/Android/media/com.varfa.game",
                          "/storage/emulated/0/Android/media/com.goldrussia.game",
                          "/storage/emulated/0/Android/media/ru.goldrussia.game"
                  };

                  for (String path : preferred) {
                      File f = new File(path);
                      if (isCandidate(f)) return save(context, f);
                  }

                  File found = scan(new File("/storage/emulated/0/Android/media"), 4, 5000);
                  if (found == null) {
                      found = scan(new File("/storage/emulated/0"), 3, 5000);
                  }
                  return found == null ? null : save(context, found);
              }

              private static File save(Context context, File dir) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .edit().putString(KEY, dir.getAbsolutePath()).apply();
                  return dir;
              }

              private static boolean isCandidate(File dir) {
                  if (dir == null || !dir.isDirectory()) return false;
                  String path = dir.getAbsolutePath().toLowerCase(Locale.ROOT);
                  if (path.contains("blackrussia") || path.contains("vostok_crime_map_test")) {
                      return false;
                  }
                  File data = new File(dir, "data");
                  File texdb = new File(dir, "texdb");
                  if (!data.isDirectory() || !texdb.isDirectory()) return false;

                  File models = new File(dir, "models");
                  File samp = new File(dir, "SAMP");
                  File gta3 = new File(texdb, "gta3");
                  File gta3Img = new File(texdb, "gta3.img");
                  return models.isDirectory() || samp.isDirectory()
                          || gta3.isDirectory() || gta3Img.isFile();
              }

              private static File scan(File root, int maxDepth, int maxVisited) {
                  if (root == null || !root.isDirectory()) return null;
                  ArrayDeque<Node> queue = new ArrayDeque<>();
                  Set<String> seen = new HashSet<>();
                  queue.add(new Node(root, 0));
                  int visited = 0;

                  while (!queue.isEmpty() && visited < maxVisited) {
                      Node n = queue.removeFirst();
                      File dir = n.file;
                      String path = dir.getAbsolutePath();
                      if (!seen.add(path)) continue;
                      visited++;

                      if (isCandidate(dir)) return dir;
                      if (n.depth >= maxDepth) continue;

                      File[] children;
                      try {
                          children = dir.listFiles(File::isDirectory);
                      } catch (Throwable ignored) {
                          children = null;
                      }
                      if (children == null) continue;
                      for (File child : children) {
                          String lower = child.getAbsolutePath().toLowerCase(Locale.ROOT);
                          if (lower.contains("blackrussia")) continue;
                          queue.addLast(new Node(child, n.depth + 1));
                      }
                  }
                  return null;
              }

              private static final class Node {
                  final File file;
                  final int depth;
                  Node(File file, int depth) {
                      this.file = file;
                      this.depth = depth;
                  }
              }
          }
          JAVA

          # Make the Rockstar wrapper use the path selected by CacheLocator.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kuzia/app/src/main/java/com/rockstargames/oswrapper/GameActivityBase.java')
          s = p.read_text(encoding='utf-8')
          old = '''    public String GetGameBaseDirectory() {\n        // Standard path: /storage/emulated/0/Documents/SampMobile/\n        File documentsDir = new File("/storage/emulated/0/");\n        File gameDir = new File(documentsDir, "VICE");\n\n        try {\n            if (!gameDir.exists()) {\n                boolean created = gameDir.mkdirs();\n\n            }\n            return gameDir.getAbsolutePath() + "/";\n        } catch (Exception e) {\n\n            return "";\n        }\n    }\n'''
          new = '''    public String GetGameBaseDirectory() {\n        String selected = com.gta.launcher.activity.CacheLocator.getSelectedPath(this);\n        File gameDir = new File(selected);\n        try {\n            return gameDir.getAbsolutePath() + "/";\n        } catch (Exception e) {\n            return "";\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('GetGameBaseDirectory block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          # Route START through cache autodetection. We intentionally do not copy,
          # rename or modify the donor cache in this experiment.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kuzia/app/src/main/java/com/gta/launcher/activity/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          if 'import java.io.File;' not in s:
              marker = 'import androidx.core.content.ContextCompat;\n'
              s = s.replace(marker, marker + '\nimport java.io.File;\n')

          old = '''    private void startGame() {\n        try {\n            Log.d("MainActivity", "Starting game");\n            Intent gameIntent = new Intent(MainActivity.this, SAMP.class);\n            startActivity(gameIntent);\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage());\n        }\n    }\n'''
          new = '''    private void startGame() {\n        try {\n            File cache = CacheLocator.findAndSave(this);\n            if (cache == null) {\n                Toast.makeText(this,\n                        "Современный CRMP-кэш не найден. Сначала скачайте кэш через официальный Crime/Gold launcher.",\n                        Toast.LENGTH_LONG).show();\n                return;\n            }\n\n            Log.d("MainActivity", "Starting Kuzia with detected cache: " + cache.getAbsolutePath());\n            Toast.makeText(this,\n                    "CRMP-кэш найден: " + cache.getAbsolutePath(),\n                    Toast.LENGTH_LONG).show();\n            Intent gameIntent = new Intent(MainActivity.this, SAMP.class);\n            startActivity(gameIntent);\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage(), e);\n            Toast.makeText(this, "Ошибка запуска игры: " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('startGame block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          # Upstream duplicates BASS libraries through CMake and jniLibs on Linux.
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass.so
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build Gold Crime cache test APK
        working-directory: kuzia
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: List APK output
        if: always()
        shell: bash
        run: |
          find kuzia/app/build/outputs -maxdepth 6 -type f 2>/dev/null | sort || true

      - name: Upload Gold Crime cache test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_CACHE_AUTODETECT
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
