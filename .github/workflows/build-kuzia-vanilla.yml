name: Build Kuzia + Gold Crime Player PVR Bridge

on:
  push:
    branches:
      - experiment-kuzia-goldcrime-cache
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Kuzia GTA-2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          path: kuzia
          persist-credentials: false

      - name: Apply CRIME compatibility patches
        shell: bash
        run: |
          set -euxo pipefail

          # Proven Linux filename-case fixes.
          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' \
            kuzia/app/src/main/cpp/samp/gui/gui.h
          sed -i 's#"RGBA.h"#"rgba.h"#g' \
            kuzia/app/src/main/cpp/samp/game/rgba.cpp

          # Java GTA base directory for this isolated compatibility test.
          sed -i 's#new File(documentsDir, "VICE")#new File(documentsDir, "GTA_CRIME_TEST")#g' \
            kuzia/app/src/main/java/com/rockstargames/oswrapper/GameActivityBase.java

          # Keep every source-side storage root unified on GTA_CRIME_TEST.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('kuzia/app/src/main')
          old = '/storage/emulated/0/GTA/'
          new = '/storage/emulated/0/GTA_CRIME_TEST/'
          changed = []

          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  changed.append(str(p))

          print('Unified cache root changed in:')
          for p in changed:
              print(' -', p)
          if not changed:
              raise SystemExit('No legacy /storage/emulated/0/GTA/ roots were found to patch')
          PY

          if grep -R --binary-files=without-match -nE '/storage/emulated/0/GTA(/|\")' kuzia/app/src/main; then
            echo 'ERROR: legacy GTA cache root still present in source'
            exit 1
          fi

          # CRIME has texdb/player only as PVR, while this GTA 2.11 runtime asks
          # NvFOpen for player.dxt.{tmb,dat,toc}. Add a deliberately narrow
          # experimental bridge at the file-open layer. Do NOT rename cache files
          # and do NOT affect mobile/txd/gta3/gta_int, which already load as ETC.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kuzia/app/src/main/cpp/samp/game/hooks.cpp')
          s = p.read_text(encoding='utf-8')

          old = '''    LOGI("NvFOpen %s", r1);\n    strcpy(lastFile, r1);\n    g_pszStorage = "/storage/emulated/0/GTA_CRIME_TEST/";\n    static char path[255]{};\n    memset(path, 0, sizeof(path));\n\n    if (strstr(r1, "emulated") != NULL)\n    {\n        // text contains "emulated"\n        sprintf(path, "%s", r1);\n    }\n    else {\n\n        sprintf(path, "%s%s", g_pszStorage, r1);\n    }\n'''

          new = '''    LOGI("NvFOpen %s", r1);\n    strcpy(lastFile, r1);\n    g_pszStorage = "/storage/emulated/0/GTA_CRIME_TEST/";\n    static char path[255]{};\n    memset(path, 0, sizeof(path));\n\n    const char* storageRequest = r1;\n    if (!strcmp(r1, "texdb/player/player.dxt.tmb")) {\n        storageRequest = "texdb/player/player.pvr.tmb";\n        LOGI("VOSTOK CRIME bridge: player.dxt.tmb -> player.pvr.tmb");\n    }\n    else if (!strcmp(r1, "texdb/player/player.dxt.dat")) {\n        storageRequest = "texdb/player/player.pvr.dat";\n        LOGI("VOSTOK CRIME bridge: player.dxt.dat -> player.pvr.dat");\n    }\n    else if (!strcmp(r1, "texdb/player/player.dxt.toc")) {\n        storageRequest = "texdb/player/player.pvr.toc";\n        LOGI("VOSTOK CRIME bridge: player.dxt.toc -> player.pvr.toc");\n    }\n\n    if (strstr(storageRequest, "emulated") != NULL)\n    {\n        // text contains "emulated"\n        sprintf(path, "%s", storageRequest);\n    }\n    else {\n\n        sprintf(path, "%s%s", g_pszStorage, storageRequest);\n    }\n'''

          if old not in s:
              raise SystemExit('NvFOpen storage block not found; refusing unsafe patch')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          grep -nF 'VOSTOK CRIME bridge' kuzia/app/src/main/cpp/samp/game/hooks.cpp

          # START guard includes the exact PVR player DB this experiment needs.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kuzia/app/src/main/java/com/gta/launcher/activity/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          if 'import java.io.File;' not in s:
              marker = 'import androidx.core.content.ContextCompat;\n'
              s = s.replace(marker, marker + '\nimport java.io.File;\n')

          old = '''    private void startGame() {\n        try {\n            Log.d("MainActivity", "Starting game");\n            Intent gameIntent = new Intent(MainActivity.this, SAMP.class);\n            startActivity(gameIntent);\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage());\n        }\n    }\n'''

          new = '''    private boolean hasGameCache() {\n        File gameDir = new File("/storage/emulated/0/GTA_CRIME_TEST");\n        return gameDir.isDirectory()\n                && new File(gameDir, "data").isDirectory()\n                && new File(gameDir, "texdb").isDirectory()\n                && new File(gameDir, "models").isDirectory()\n                && new File(gameDir, "SAMP").isDirectory()\n                && new File(gameDir, "SAMP/settings.ini").isFile()\n                && new File(gameDir, "texdb/player/player.txt").isFile()\n                && new File(gameDir, "texdb/player/player.pvr.tmb").isFile()\n                && new File(gameDir, "texdb/player/player.pvr.dat").isFile()\n                && new File(gameDir, "texdb/player/player.pvr.toc").isFile();\n    }\n\n    private void startGame() {\n        try {\n            if (!hasGameCache()) {\n                Toast.makeText(this,\n                        "Кэш CRIME неполный. Нужны GTA_CRIME_TEST и player.pvr.*",\n                        Toast.LENGTH_LONG).show();\n                return;\n            }\n            Toast.makeText(this, "Тест: CRIME player PVR bridge", Toast.LENGTH_SHORT).show();\n            startActivity(new Intent(MainActivity.this, SAMP.class));\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage(), e);\n            Toast.makeText(this, "Ошибка запуска игры: " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();\n        }\n    }\n'''

          if old not in s:
              raise SystemExit('startGame block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          # CMake already supplies BASS; remove duplicate jniLibs copies.
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass.so
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so

          cat > kuzia/VOSTOK_SOURCE_STATE.md <<'EOF'
          # VOSTOK / Kuzia + CRIME player PVR bridge experiment

          Upstream: kuzia15/SAMP-Mobile
          Upstream ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          VOSTOK experiment branch: experiment-kuzia-goldcrime-cache

          Confirmed preserved fixes:
          - Linux filename-case build fixes.
          - Java/native cache root unified at /storage/emulated/0/GTA_CRIME_TEST/.
          - No source-side legacy /storage/emulated/0/GTA/ root allowed.
          - Duplicate BASS jniLibs removed because CMake supplies them.

          Current isolated experiment:
          - Only texdb/player DXT file-open requests are redirected to existing PVR files.
          - mobile/txd/gta3/gta_int remain untouched and continue using the formats requested by libGame.
          - This tests whether the runtime can consume CRIME's player PVR database through its current DXT request path.
          - This is NOT a MASTER promotion and must pass device smoke.
          EOF

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK_KUZIA_CRIME_PLAYER_PVR_SOURCE
          path: kuzia
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build player-PVR bridge APK
        working-directory: kuzia
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          rm -rf app/.cxx app/build/intermediates/cxx app/build/intermediates/merged_native_libs
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --rerun-tasks

      - name: Verify rebuilt libsamp
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find kuzia/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          unzip -p "$APK" lib/arm64-v8a/libsamp.so > /tmp/libsamp.so
          test -s /tmp/libsamp.so

          strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA_CRIME_TEST/' | head -20
          strings /tmp/libsamp.so | grep -F 'VOSTOK CRIME bridge: player.dxt.tmb -> player.pvr.tmb'
          strings /tmp/libsamp.so | grep -F 'texdb/player/player.pvr.dat'

          if strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA/'; then
            echo 'ERROR: rebuilt libsamp.so still contains legacy /storage/emulated/0/GTA/'
            exit 1
          fi

          sha256sum /tmp/libsamp.so "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_PLAYER_PVR_BRIDGE
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload rebuilt libsamp
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_PLAYER_PVR_BRIDGE_LIBSAMP
          path: /tmp/libsamp.so
          if-no-files-found: error
          retention-days: 7
