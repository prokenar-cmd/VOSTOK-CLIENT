name: Build Kuzia + Gold Crime Settings Fix

on:
  push:
    branches:
      - experiment-kuzia-goldcrime-cache
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Kuzia GTA-2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          path: kuzia
          persist-credentials: false

      - name: Apply Gold Crime mirror compatibility patches
        shell: bash
        run: |
          set -euxo pipefail

          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' \
            kuzia/app/src/main/cpp/samp/gui/gui.h
          sed -i 's#"RGBA.h"#"rgba.h"#g' \
            kuzia/app/src/main/cpp/samp/game/rgba.cpp

          # GTA base directory for this isolated compatibility test.
          sed -i 's#new File(documentsDir, "VICE")#new File(documentsDir, "GTA_CRIME_TEST")#g' \
            kuzia/app/src/main/java/com/rockstargames/oswrapper/GameActivityBase.java

          # Kuzia native code has its own hardcoded settings path. Run #10 crashed
          # in CSettings because it still looked at /storage/emulated/0/GTA/.
          sed -i 's#/storage/emulated/0/GTA/SAMP/settings.ini#/storage/emulated/0/GTA_CRIME_TEST/SAMP/settings.ini#g' \
            kuzia/app/src/main/cpp/samp/settings.cpp

          grep -n 'GTA_CRIME_TEST/SAMP/settings.ini' kuzia/app/src/main/cpp/samp/settings.cpp

          python3 - <<'PY'
          from pathlib import Path

          p = Path('kuzia/app/src/main/java/com/gta/launcher/activity/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          if 'import java.io.File;' not in s:
              marker = 'import androidx.core.content.ContextCompat;\n'
              s = s.replace(marker, marker + '\nimport java.io.File;\n')

          old = '''    private void startGame() {\n        try {\n            Log.d("MainActivity", "Starting game");\n            Intent gameIntent = new Intent(MainActivity.this, SAMP.class);\n            startActivity(gameIntent);\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage());\n        }\n    }\n'''

          new = '''    private boolean hasGameCache() {\n        File gameDir = new File("/storage/emulated/0/GTA_CRIME_TEST");\n        return gameDir.isDirectory()\n                && new File(gameDir, "data").isDirectory()\n                && new File(gameDir, "texdb").isDirectory()\n                && new File(gameDir, "models").isDirectory()\n                && new File(gameDir, "SAMP").isDirectory()\n                && new File(gameDir, "SAMP/settings.ini").isFile();\n    }\n\n    private void startGame() {\n        try {\n            if (!hasGameCache()) {\n                Toast.makeText(this,\n                        "Кэш CRIME неполный. Нужен /storage/emulated/0/GTA_CRIME_TEST/ с SAMP/settings.ini",\n                        Toast.LENGTH_LONG).show();\n                return;\n            }\n            Toast.makeText(this, "Тест: запускаем Kuzia с кэшем CRIME", Toast.LENGTH_SHORT).show();\n            startActivity(new Intent(MainActivity.this, SAMP.class));\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage(), e);\n            Toast.makeText(this, "Ошибка запуска игры: " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();\n        }\n    }\n'''

          if old not in s:
              raise SystemExit('startGame block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass.so
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so

          cat > kuzia/VOSTOK_SOURCE_STATE.md <<'EOF'
          # VOSTOK / Kuzia launcher source snapshot

          Purpose: editable Codex source snapshot of the current isolated Kuzia + CRIME compatibility experiment.

          Upstream: kuzia15/SAMP-Mobile
          Upstream ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          VOSTOK experiment branch: experiment-kuzia-goldcrime-cache
          Base experiment commit before export: 6e5fe210fdc8fe0cb4b80b785f9d84558d00403f

          Applied changes:
          - Linux filename-case build fixes.
          - GTA base directory changed from VICE to GTA_CRIME_TEST.
          - Native SAMP settings path changed to /storage/emulated/0/GTA_CRIME_TEST/SAMP/settings.ini.
          - Launcher START checks CRIME cache directories and SAMP/settings.ini before native launch.
          - Duplicate BASS jniLibs removed because CMake already supplies them.

          This is an experimental source snapshot only. It does not replace VOSTOK MASTER or legacy main.
          EOF

      - name: Upload current launcher source for Codex
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK_KUZIA_LAUNCHER_SOURCE_CURRENT
          path: kuzia
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build settings-fix APK
        working-directory: kuzia
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload settings-fix APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_SETTINGS_FIX
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
