name: Build Kuzia GTA 2.11 Vanilla

on:
  push:
    branches:
      - experiment-kuzia-vanilla
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Kuzia GTA-2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          path: kuzia
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build vanilla debug APK
        working-directory: kuzia
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: List APK output
        if: always()
        shell: bash
        run: |
          find kuzia/app/build/outputs -maxdepth 6 -type f 2>/dev/null | sort || true

      - name: Upload vanilla APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GTA_2_11_VANILLA_DEBUG
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
