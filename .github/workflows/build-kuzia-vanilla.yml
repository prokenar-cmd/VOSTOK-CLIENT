name: Build Kuzia GTA 2.11 Vanilla

on:
  push:
    branches:
      - experiment-kuzia-vanilla
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Kuzia GTA-2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          path: kuzia
          persist-credentials: false

      - name: Apply build and startup compatibility fixes
        shell: bash
        run: |
          set -euxo pipefail

          # Upstream was developed on case-insensitive Windows; Linux CI exposes
          # two filename-case mismatches. These changes do not alter client logic.
          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' \
            kuzia/app/src/main/cpp/samp/gui/gui.h
          sed -i 's#"RGBA.h"#"rgba.h"#g' \
            kuzia/app/src/main/cpp/samp/game/rgba.cpp

          # Upstream README says the GTA 2.11 cache lives in /storage/emulated/0/GTA/,
          # while this source revision accidentally points GameActivityBase to /VICE/.
          # Align runtime with the documented cache location.
          sed -i 's#new File(documentsDir, "VICE")#new File(documentsDir, "GTA")#g' \
            kuzia/app/src/main/java/com/rockstargames/oswrapper/GameActivityBase.java

          # Do not enter native GTA when the external GTA 2.11 cache is missing.
          # The vanilla build previously appeared to "close" immediately because
          # START launched the native activity even with an empty game directory.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kuzia/app/src/main/java/com/gta/launcher/activity/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          if 'import java.io.File;' not in s:
              marker = 'import androidx.core.content.ContextCompat;\n'
              s = s.replace(marker, marker + '\nimport java.io.File;\n')

          old = '''    private void startGame() {\n        try {\n            Log.d("MainActivity", "Starting game");\n            Intent gameIntent = new Intent(MainActivity.this, SAMP.class);\n            startActivity(gameIntent);\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage());\n        }\n    }\n'''

          new = '''    private boolean hasGameCache() {\n        File gameDir = new File("/storage/emulated/0/GTA");\n        File dataDir = new File(gameDir, "data");\n        File modelsDir = new File(gameDir, "models");\n        File texdbDir = new File(gameDir, "texdb");\n        return gameDir.isDirectory()\n                && dataDir.isDirectory()\n                && modelsDir.isDirectory()\n                && texdbDir.isDirectory();\n    }\n\n    private void startGame() {\n        try {\n            if (!hasGameCache()) {\n                Log.e("MainActivity", "GTA 2.11 cache missing at /storage/emulated/0/GTA/");\n                Toast.makeText(this,\n                        "Кэш GTA 2.11 не найден. Ожидается папка /storage/emulated/0/GTA/",\n                        Toast.LENGTH_LONG).show();\n                return;\n            }\n\n            Log.d("MainActivity", "Starting game with cache /storage/emulated/0/GTA/");\n            Intent gameIntent = new Intent(MainActivity.this, SAMP.class);\n            startActivity(gameIntent);\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage(), e);\n            Toast.makeText(this, "Ошибка запуска игры: " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();\n        }\n    }\n'''

          if old not in s:
              raise SystemExit('startGame() block not found; upstream changed')

          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

          # BASS/BASS SSL are already linked from CMake vendor/bass/libs and AGP
          # packages those linked shared objects. Upstream also places copies in
          # jniLibs, which causes mergeDebugNativeLibs duplicate-path failure.
          # Keep the CMake-linked copies so runtime matches what libsamp links to.
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass.so
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build vanilla debug APK
        working-directory: kuzia
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: List APK output
        if: always()
        shell: bash
        run: |
          find kuzia/app/build/outputs -maxdepth 6 -type f 2>/dev/null | sort || true

      - name: Upload vanilla APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GTA_2_11_VANILLA_DEBUG
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
