name: Build Kuzia + Gold Crime Unified Root

on:
  push:
    branches:
      - experiment-kuzia-goldcrime-cache
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Kuzia GTA-2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          path: kuzia
          persist-credentials: false

      - name: Apply CRIME unified cache-root patches
        shell: bash
        run: |
          set -euxo pipefail

          # Upstream Linux build fixes already proven in earlier experiment runs.
          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' \
            kuzia/app/src/main/cpp/samp/gui/gui.h
          sed -i 's#"RGBA.h"#"rgba.h"#g' \
            kuzia/app/src/main/cpp/samp/game/rgba.cpp

          # Java GTA base directory for this isolated compatibility test.
          sed -i 's#new File(documentsDir, "VICE")#new File(documentsDir, "GTA_CRIME_TEST")#g' \
            kuzia/app/src/main/java/com/rockstargames/oswrapper/GameActivityBase.java

          # Native code contains several independent hardcoded /GTA/ roots
          # (settings.cpp, main.cpp, game/hooks.cpp and possibly more). Replace
          # the exact legacy root everywhere under app/src/main so Java and every
          # native loader use the same CRIME test cache.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('kuzia/app/src/main')
          old = '/storage/emulated/0/GTA/'
          new = '/storage/emulated/0/GTA_CRIME_TEST/'
          changed = []

          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  changed.append(str(p))

          print('Unified cache root changed in:')
          for p in changed:
              print(' -', p)
          if not changed:
              raise SystemExit('No legacy /storage/emulated/0/GTA/ roots were found to patch')
          PY

          # Fail the build if any exact legacy /GTA root remains in source.
          if grep -R --binary-files=without-match -nE '/storage/emulated/0/GTA(/|\")' kuzia/app/src/main; then
            echo 'ERROR: legacy GTA cache root still present in source'
            exit 1
          fi

          grep -R --binary-files=without-match -nF '/storage/emulated/0/GTA_CRIME_TEST/' \
            kuzia/app/src/main/cpp kuzia/app/src/main/java | head -100

          # START guard: do not enter native GTA with an incomplete CRIME cache.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kuzia/app/src/main/java/com/gta/launcher/activity/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          if 'import java.io.File;' not in s:
              marker = 'import androidx.core.content.ContextCompat;\n'
              s = s.replace(marker, marker + '\nimport java.io.File;\n')

          old = '''    private void startGame() {\n        try {\n            Log.d("MainActivity", "Starting game");\n            Intent gameIntent = new Intent(MainActivity.this, SAMP.class);\n            startActivity(gameIntent);\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage());\n        }\n    }\n'''

          new = '''    private boolean hasGameCache() {\n        File gameDir = new File("/storage/emulated/0/GTA_CRIME_TEST");\n        return gameDir.isDirectory()\n                && new File(gameDir, "data").isDirectory()\n                && new File(gameDir, "texdb").isDirectory()\n                && new File(gameDir, "models").isDirectory()\n                && new File(gameDir, "SAMP").isDirectory()\n                && new File(gameDir, "SAMP/settings.ini").isFile();\n    }\n\n    private void startGame() {\n        try {\n            if (!hasGameCache()) {\n                Toast.makeText(this,\n                        "Кэш CRIME неполный. Нужен /storage/emulated/0/GTA_CRIME_TEST/ с SAMP/settings.ini",\n                        Toast.LENGTH_LONG).show();\n                return;\n            }\n            Toast.makeText(this, "Тест: запускаем Kuzia с кэшем CRIME", Toast.LENGTH_SHORT).show();\n            startActivity(new Intent(MainActivity.this, SAMP.class));\n        } catch (Exception e) {\n            Log.e("MainActivity", "Error starting game: " + e.getMessage(), e);\n            Toast.makeText(this, "Ошибка запуска игры: " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();\n        }\n    }\n'''

          if old not in s:
              raise SystemExit('startGame block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          # CMake already supplies BASS; remove duplicate jniLibs copies.
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass.so
          rm -f kuzia/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so

          cat > kuzia/VOSTOK_SOURCE_STATE.md <<'EOF'
          # VOSTOK / Kuzia launcher source snapshot

          Purpose: editable source snapshot of the isolated Kuzia + CRIME compatibility experiment.

          Upstream: kuzia15/SAMP-Mobile
          Upstream ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          VOSTOK experiment branch: experiment-kuzia-goldcrime-cache

          Current experiment changes:
          - Linux filename-case build fixes.
          - Java GTA base directory changed from VICE to GTA_CRIME_TEST.
          - Every exact native/source cache root /storage/emulated/0/GTA/ under app/src/main is changed to /storage/emulated/0/GTA_CRIME_TEST/.
          - This includes settings.cpp, main.cpp, game/hooks.cpp and any other discovered source occurrence.
          - Launcher START validates data, texdb, models, SAMP and SAMP/settings.ini before native launch.
          - Duplicate BASS jniLibs removed because CMake already supplies them.
          - CI fails if a legacy /storage/emulated/0/GTA root remains.
          - CI also inspects the rebuilt arm64 libsamp.so inside the APK and fails if it still contains the old root.

          This is an experiment only. It does not replace VOSTOK MASTER, current legacy client MASTER, or server Candidate 028.
          EOF

      - name: Upload unified-root source for Codex
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK_KUZIA_LAUNCHER_SOURCE_ROOT_UNIFIED
          path: kuzia
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build unified-root APK
        working-directory: kuzia
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          rm -rf app/.cxx app/build/intermediates/cxx app/build/intermediates/merged_native_libs
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --rerun-tasks

      - name: Verify rebuilt libsamp cache root inside APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find kuzia/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          unzip -p "$APK" lib/arm64-v8a/libsamp.so > /tmp/libsamp.so
          test -s /tmp/libsamp.so

          echo 'Expected CRIME root strings in rebuilt libsamp.so:'
          strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA_CRIME_TEST/' | head -20

          if strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA/'; then
            echo 'ERROR: rebuilt libsamp.so still contains legacy /storage/emulated/0/GTA/'
            exit 1
          fi

          sha256sum /tmp/libsamp.so "$APK"

      - name: Upload unified-root APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_ROOT_UNIFIED
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload rebuilt libsamp
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_ROOT_UNIFIED_LIBSAMP
          path: /tmp/libsamp.so
          if-no-files-found: error
          retention-days: 7
