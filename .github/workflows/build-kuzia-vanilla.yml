name: Build Kuzia GTA 2.11 Vanilla

on:
  push:
    branches:
      - experiment-kuzia-vanilla
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Kuzia GTA-2.11 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 5e531514a0bbb3d56b1a72e51fa44b18cfaf2ee2
          path: kuzia
          persist-credentials: false

      - name: Apply Linux case-sensitivity compatibility fix
        shell: bash
        run: |
          set -euxo pipefail
          # Upstream GTA-2.11 references playerTabList.h, while the actual file
          # is named playertablist.h. Windows hides this; Linux CI does not.
          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' \
            kuzia/app/src/main/cpp/samp/gui/gui.h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build vanilla debug APK
        working-directory: kuzia
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: List APK output
        if: always()
        shell: bash
        run: |
          find kuzia/app/build/outputs -maxdepth 6 -type f 2>/dev/null | sort || true

      - name: Upload vanilla APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GTA_2_11_VANILLA_DEBUG
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
