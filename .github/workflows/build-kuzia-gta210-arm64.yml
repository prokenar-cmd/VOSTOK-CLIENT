name: Build Kuzia GTA 2.10 ARM64 Startup Diagnostic

on:
  push:
    branches:
      - experiment-kuzia-gta210-arm64-diag-startup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout diagnostic files
        uses: actions/checkout@v4
        with:
          path: vostok-ci

      - name: Checkout exact Kuzia GTA 2.10 source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: 980dd3edccd422c4771717a8de3df3d84ba40c21
          path: kuzia
          persist-credentials: false

      - name: Apply build-only compatibility fixes
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C kuzia rev-parse HEAD)" = "980dd3edccd422c4771717a8de3df3d84ba40c21"
          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' kuzia/app/src/main/cpp/samp/gui/gui.h
          sed -i 's#"RGBA.h"#"rgba.h"#g' kuzia/app/src/main/cpp/samp/game/rgba.cpp
          grep -RIl 'vendor/RakNet' kuzia/app/src/main/cpp | xargs -r sed -i 's#vendor/RakNet#vendor/raknet#g'
          sed -i '/mint\.splunk\.com\/gradle/d' kuzia/build.gradle
          sed -i 's#com.github.amitshekhariitbhu:PRDownloader:1.0.1#com.github.amitshekhariitbhu:PRDownloader:1.0.2#g' kuzia/app/build.gradle

      - name: Inject startup diagnostic launcher
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p kuzia/app/src/main/java/com/samp/mobile/diag
          cp vostok-ci/research/kuzia_diag/*.java kuzia/app/src/main/java/com/samp/mobile/diag/
          python3 vostok-ci/research/kuzia_diag/patch_manifest.py kuzia/app/src/main/AndroidManifest.xml
          grep -q 'com.samp.mobile.diag.DiagnosticsActivity' kuzia/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Create build signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/keys"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/keys/new.jks" \
            -storepass 123123 \
            -keypass 123123 \
            -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VOSTOK Research,O=VOSTOK,C=RU"

      - name: Build diagnostic APK
        working-directory: kuzia
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and package diagnostic APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find kuzia/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          unzip -l "$APK" | tee apk-files.txt
          grep -q 'lib/arm64-v8a/libGTASA.so' apk-files.txt
          grep -Eq 'lib/arm64-v8a/lib(samp|SAMP)\.so' apk-files.txt
          cp "$APK" KUZIA_GTA_2_10_ARM64_STARTUP_DIAG.apk
          sha256sum KUZIA_GTA_2_10_ARM64_STARTUP_DIAG.apk | tee KUZIA_GTA_2_10_ARM64_STARTUP_DIAG.sha256
          stat -c '%n %s bytes' KUZIA_GTA_2_10_ARM64_STARTUP_DIAG.apk

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GTA_2_10_ARM64_STARTUP_DIAG
          path: |
            KUZIA_GTA_2_10_ARM64_STARTUP_DIAG.apk
            KUZIA_GTA_2_10_ARM64_STARTUP_DIAG.sha256
          if-no-files-found: error
          retention-days: 90
