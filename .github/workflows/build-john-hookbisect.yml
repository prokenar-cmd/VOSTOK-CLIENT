name: Build John GTA 2.11.311 Hook Bisect

on:
  push:
    branches:
      - experiment-john-hookbisect
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - no_inject
          - no_urez
          - first_half
          - second_half
          - special_min

    steps:
      - name: Checkout John source
        uses: actions/checkout@v4
        with:
          repository: JohnPeriaX/samp-mobile-2.11.311
          ref: 0df908fccfc26ac3ef54e004504b5b1f122362b1
          path: john
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: john/**/*.gradle*

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;26.2.11394342' \
            'cmake;3.22.1'

      - name: Patch John hook bisect variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          variant = os.environ['VARIANT']
          main = Path('john/app/src/main/cpp/multiplayer/samp/main.cpp')
          text = main.read_text(encoding='utf-8')

          old_endpoint = 'pNetGame = new CNetGame("gta-irz.com", 7777, "Luca_Runky", "");'
          new_endpoint = '''if (!pSettings) {
                    FLog("Network init aborted: settings are unavailable");
                    return;
                }
                pNetGame = new CNetGame(
                        pSettings->Get().szHost,
                        pSettings->Get().iPort,
                        pSettings->Get().szNickName,
                        pSettings->Get().szPassword);'''
          if old_endpoint not in text:
              raise SystemExit('Expected hard-coded John endpoint not found')
          text = text.replace(old_endpoint, new_endpoint, 1)

          # Keep the already-proven hook_only baseline: preserve InstallSpecialHooks,
          # disable unrelated early patch layers.
          for old, new in [
              ('\tApplyPatches_level0();', '\tFLog("DIAG bisect: ApplyPatches_level0 disabled");'),
              ('\tInitFPSFix(120);', '\tFLog("DIAG bisect: InitFPSFix disabled");'),
              ('    InitRenderWareFunctions();', '    FLog("DIAG bisect: InitRenderWareFunctions disabled");'),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected main init call not found: {old!r}')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          hooks = Path('john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp')
          h = hooks.read_text(encoding='utf-8')

          def replace_once(old, new):
              global h
              if old not in h:
                  raise SystemExit(f'Expected Hooks.cpp fragment not found: {old!r}')
              h = h.replace(old, new, 1)

          install_sig = 'void InstallSpecialHooks()\n{\n    InjectHooks();\n\n    InstallUrezHooks();'
          if install_sig not in h:
              raise SystemExit('InstallSpecialHooks signature block not found')

          first_half_calls = [
              '    CTouchInterface::InjectHooks(); //',
              '    CWidgetGta::InjectHooks();',
              '    CCustomCarEnvMapPipeline::InjectHooks();',
              '    CCustomBuildingDNPipeline::InjectHooks();',
              '    CMobileMenu::InjectHooks();',
              '    CMobileSettings::InjectHooks();',
              '    CGame::InjectHooks();',
              '    CSprite2d::InjectHooks();',
              '    CStreamingInfo::InjectHooks();',
          ]
          second_half_calls = [
              '    CHook::RET("_ZN11CPlayerInfo14LoadPlayerSkinEv");',
              '    CHook::RET("_ZN11CPopulation10InitialiseEv");',
              '    CModelInfo::injectHooks(); //',
              '    CTimer::InjectHooks(); //',
              '    CPools::InjectHooks(); //',
              '    CStreaming::InjectHooks();',
              '    CRenderer::InjectHooks();',
              '    CVisibilityPlugins::InjectHooks();',
          ]

          if variant == 'no_inject':
              replace_once('void InstallSpecialHooks()\n{\n    InjectHooks();',
                           'void InstallSpecialHooks()\n{\n    FLog("DIAG no_inject: InjectHooks disabled");')
          elif variant == 'no_urez':
              replace_once('    InstallUrezHooks();', '    FLog("DIAG no_urez: InstallUrezHooks disabled");')
          elif variant == 'first_half':
              for call in first_half_calls:
                  replace_once(call, '    FLog("DIAG first_half: disabled ' + call.strip().replace('"','') + '");')
          elif variant == 'second_half':
              for call in second_half_calls:
                  replace_once(call, '    FLog("DIAG second_half: disabled ' + call.strip().replace('"','') + '");')
          elif variant == 'special_min':
              replace_once('void InstallSpecialHooks()\n{\n    InjectHooks();',
                           'void InstallSpecialHooks()\n{\n    FLog("DIAG special_min: InjectHooks disabled");')
              replace_once('    InstallUrezHooks();', '    FLog("DIAG special_min: InstallUrezHooks disabled");')
          else:
              raise SystemExit(f'Unknown variant: {variant}')

          hooks.write_text(h, encoding='utf-8')

          assets = Path('john/app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)
          (assets / 'settings.ini').write_text('''[client]
          name=AndroidUser
          host=127.0.0.1
          port=7777
          password=
          version=0.3.7
          autoaim=false

          [debug]
          debug=false
          online=true

          [gui]
          Font=arial.ttf
          FontSize=30
          FontOutline=2
          androidkeyboard=false
          VoiceChatEnable=false
          fps=0
          ChatMaxMessages=6
          FPSLimit=60
          Dialog=true
          ''', encoding='utf-8')
          PY

          echo "=== HOOK BISECT VARIANT: $VARIANT ==="
          grep -n -A26 -B3 'void InjectHooks' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -n -A32 -B3 'void InstallSpecialHooks' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp

      - name: Verify John source profile
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "compileSdk 36" john/app/build.gradle
          grep -q "targetSdk 36" john/app/build.gradle
          grep -q "abiFilters 'arm64-v8a'" john/app/build.gradle
          grep -q "ndkVersion '26.2.11394342'" john/app/build.gradle
          grep -q 'max-page-size=16384' john/app/src/main/cpp/multiplayer/CMakeLists.txt
          test -f john/app/src/main/jniLibs/arm64-v8a/libGame.so
          test "$(sha256sum john/app/src/main/jniLibs/arm64-v8a/libGame.so | awk '{print toupper($1)}')" = "4C6A7445E30B27AFDDA781302E4DB9BAC89C28FC1181B68B1EEF16F84D6A282E"

      - name: Remove duplicate packaged native libs
        shell: bash
        run: |
          set -euxo pipefail
          rm -f \
            john/app/src/main/jniLibs/arm64-v8a/libbass.so \
            john/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so \
            john/app/src/main/jniLibs/arm64-v8a/libGlossHook.so

      - name: Build diagnostic APK
        working-directory: john
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Validate and stage diagnostic APK
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euxo pipefail
          APK="$(find john/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          rm -rf /tmp/john-apk
          mkdir -p /tmp/john-apk
          unzip -q "$APK" -d /tmp/john-apk
          test -f /tmp/john-apk/lib/arm64-v8a/libsamp.so
          test -f /tmp/john-apk/lib/arm64-v8a/libGame.so
          test ! -d /tmp/john-apk/lib/armeabi-v7a
          test "$(sha256sum /tmp/john-apk/lib/arm64-v8a/libGame.so | awk '{print toupper($1)}')" = "4C6A7445E30B27AFDDA781302E4DB9BAC89C28FC1181B68B1EEF16F84D6A282E"
          OUT="JOHN_HOOK_BISECT_${VARIANT}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: JOHN-HOOK-BISECT-${{ matrix.variant }}
          path: |
            JOHN_HOOK_BISECT_${{ matrix.variant }}.apk
            JOHN_HOOK_BISECT_${{ matrix.variant }}.apk.sha256
          if-no-files-found: error
          retention-days: 14
