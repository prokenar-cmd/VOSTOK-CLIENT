name: Build John GTA 2.11.311 Core Baseline

on:
  push:
    branches:
      - experiment-john-core-baseline
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout John source
        uses: actions/checkout@v4
        with:
          repository: JohnPeriaX/samp-mobile-2.11.311
          ref: 0df908fccfc26ac3ef54e004504b5b1f122362b1
          path: john
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: john/**/*.gradle*

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Patch to GTA core baseline
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('john/app/src/main/cpp/multiplayer/samp/main.cpp')
          text = main.read_text(encoding='utf-8')

          replacements = [
              ('\tApplyPatches_level0();', '\tFLog("VOSTOK CORE: ApplyPatches_level0 skipped");'),
              ('\tInitFPSFix(120);', '\tFLog("VOSTOK CORE: early FPS patch skipped");'),
              ('    InitRenderWareFunctions();', '    FLog("VOSTOK CORE: InitRenderWareFunctions enabled");\n    InitRenderWareFunctions();'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected main.cpp init call not found: {old!r}')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          hooks = Path('john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp')
          h = hooks.read_text(encoding='utf-8')

          old_special = 'void InstallSpecialHooks()\n{\n    InjectHooks();\n\n    InstallUrezHooks();'
          new_special = 'void InstallSpecialHooks()\n{\n    FLog("VOSTOK CORE: InjectHooks skipped during GTA baseline boot");\n\n    FLog("VOSTOK CORE: InstallUrezHooks skipped during GTA baseline boot");'
          if old_special not in h:
              raise SystemExit('Expected InstallSpecialHooks prologue not found')
          h = h.replace(old_special, new_special, 1)

          old_rw = '''bool CGame__InitialiseRenderWare_hook() {
    FLog("Loading SAMP texture database..");
    CGame__InitialiseRenderWare();

    TextureDatabaseRuntime::Load("samp", false, TextureDatabaseFormat::DF_Default);

    InitGui();
    return true;
}'''
          new_rw = '''bool CGame__InitialiseRenderWare_hook() {
    FLog("VOSTOK CORE: entering original CGame::InitialiseRenderWare");
    const bool result = CGame__InitialiseRenderWare();
    FLog("VOSTOK CORE: original CGame::InitialiseRenderWare returned %d", result ? 1 : 0);
    FLog("VOSTOK CORE: SAMP texdb/GUI/voice/network intentionally deferred");
    return result;
}'''
          if old_rw not in h:
              raise SystemExit('Expected CGame__InitialiseRenderWare_hook block not found')
          h = h.replace(old_rw, new_rw, 1)
          hooks.write_text(h, encoding='utf-8')
          PY

          grep -n -A14 -B3 'CGame__InitialiseRenderWare_hook' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -n -A18 -B2 'void InstallSpecialHooks' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -n -A8 -B6 'InitRenderWareFunctions' john/app/src/main/cpp/multiplayer/samp/main.cpp

      - name: Verify source profile
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "compileSdk 36" john/app/build.gradle
          grep -q "targetSdk 36" john/app/build.gradle
          grep -q "abiFilters 'arm64-v8a'" john/app/build.gradle
          test "$(sha256sum john/app/src/main/jniLibs/arm64-v8a/libGame.so | awk '{print toupper($1)}')" = "4C6A7445E30B27AFDDA781302E4DB9BAC89C28FC1181B68B1EEF16F84D6A282E"
          grep -q 'VOSTOK CORE: SAMP texdb/GUI/voice/network intentionally deferred' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp

      - name: Remove duplicate packaged native libs
        shell: bash
        run: |
          set -euxo pipefail
          rm -f john/app/src/main/jniLibs/arm64-v8a/libbass.so john/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so john/app/src/main/jniLibs/arm64-v8a/libGlossHook.so

      - name: Build APK
        working-directory: john
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Validate and stage APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find john/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          rm -rf /tmp/john-apk
          mkdir -p /tmp/john-apk
          unzip -q "$APK" -d /tmp/john-apk
          test -f /tmp/john-apk/lib/arm64-v8a/libsamp.so
          test -f /tmp/john-apk/lib/arm64-v8a/libGame.so
          test ! -d /tmp/john-apk/lib/armeabi-v7a
          test "$(sha256sum /tmp/john-apk/lib/arm64-v8a/libGame.so | awk '{print toupper($1)}')" = "4C6A7445E30B27AFDDA781302E4DB9BAC89C28FC1181B68B1EEF16F84D6A282E"
          cp "$APK" JOHN_CORE_BASELINE_ARM64.apk
          sha256sum JOHN_CORE_BASELINE_ARM64.apk > JOHN_CORE_BASELINE_ARM64.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOHN-CORE-BASELINE-ARM64
          path: |
            JOHN_CORE_BASELINE_ARM64.apk
            JOHN_CORE_BASELINE_ARM64.apk.sha256
          if-no-files-found: error
          retention-days: 14
