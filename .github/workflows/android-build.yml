name: VOSTOK Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout VOSTOK orchestration
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned Parad1st client source
        run: |
          git clone https://github.com/Parad1st/Black-Russia-Source.git client
          cd client
          git checkout b7574b3ad246f31a15d15a28075936dd62e65fad
          git rev-parse HEAD

      - name: Apply VOSTOK source overlay
        run: |
          cp -a overlay/. client/
          rm -f client/app/src/main/java/com/blackrussia/launcher/other/UnZipCallback.java
          python3 tools/apply_vostok_ui_foundation.py
          python3 tools/apply_vostok_native_ui_bridge.py
          python3 tools/validate_account_core.py client

      - name: Fix launcher coordinate space and recovery background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/app/src/main/java/com/blackrussia/launcher/ui/VostokLauncherView.java')
          s = p.read_text()
          anchor = '    private static final RectF PLAY = new RectF(1380, 620, 1792, 724);'
          if s.count(anchor) != 1:
              raise SystemExit('launcher PLAY anchor mismatch')
          s = s.replace(anchor, '    private static final float DESIGN_WIDTH = 1891.0f;\n    private static final float DESIGN_HEIGHT = 831.0f;\n    ' + anchor.strip(), 1)
          old = 'scale = Math.max(getWidth() / bitmapW, getHeight() / bitmapH);\n        float drawW = bitmapW * scale, drawH = bitmapH * scale;'
          if s.count(old) != 1:
              raise SystemExit('launcher scale block mismatch')
          new = 'scale = Math.max(getWidth() / DESIGN_WIDTH, getHeight() / DESIGN_HEIGHT);\n        float drawW = DESIGN_WIDTH * scale, drawH = DESIGN_HEIGHT * scale;'
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f client/app/src/main/res/drawable-nodpi/vostok_launcher_reference.webp
          cp client/app/src/main/res/drawable/mylogo.jpg client/app/src/main/res/drawable-nodpi/vostok_launcher_reference.jpg
          file client/app/src/main/res/drawable-nodpi/vostok_launcher_reference.jpg
          grep -q 'DESIGN_WIDTH = 1891.0f' client/app/src/main/java/com/blackrussia/launcher/ui/VostokLauncherView.java

      - name: Apply VOSTOK Android build compatibility
        working-directory: client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('build.gradle').write_text('''// VOSTOK CI build configuration\nbuildscript {\n    repositories {\n        mavenCentral()\n        google()\n        jcenter()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.2.1'\n    }\n}\n\nallprojects {\n    repositories {\n        mavenCentral()\n        google()\n        jcenter()\n        maven { url "https://jitpack.io" }\n    }\n}\n\ntask clean(type: Delete) {\n    delete rootProject.buildDir\n}\n''')
          Path('app/build.gradle').write_text('''apply plugin: 'com.android.application'\n\nandroid {\n    namespace "com.blackrussia.game"\n    compileSdkVersion 30\n\n    compileOptions {\n        sourceCompatibility 1.8\n        targetCompatibility 1.8\n    }\n\n    defaultConfig {\n        minSdkVersion 17\n        targetSdkVersion 28\n        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"\n        applicationId "com.vostok.roleplay"\n        versionName "vostok-dev-0.1.7"\n        versionCode 17\n        vectorDrawables.useSupportLibrary = true\n        multiDexEnabled = true\n        ndk { abiFilters 'armeabi-v7a' }\n    }\n}\n\ndependencies {\n    implementation fileTree(dir: "libs", include: ["*.jar"])\n    implementation 'androidx.appcompat:appcompat:1.1.0'\n    implementation 'com.google.android.material:material:1.0.0'\n    implementation 'com.tuyenmonkey:mkloader:1.4.0'\n    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'\n    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'\n    implementation "com.github.skydoves:colorpickerpreference:2.0.4"\n    testImplementation 'junit:junit:4.12'\n    implementation 'com.github.Triggertrap:SeekArc:v1.1'\n    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'\n    implementation 'io.github.dinuscxj:circleprogressbar:1.4.1'\n    implementation 'com.makeramen:roundedimageview:2.3.0'\n    implementation 'com.github.bumptech.glide:glide:4.13.0'\n    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'\n    implementation 'com.google.firebase:firebase-database:20.0.4'\n    implementation 'com.github.hzy3774:AndroidP7zip:v1.7.2'\n    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'\n    implementation platform('com.google.firebase:firebase-bom:29.2.1')\n    implementation 'com.liulishuo.filedownloader:library:1.7.7'\n}\n''')
          p=Path('gradle/wrapper/gradle-wrapper.properties')
          s=p.read_text()
          import re
          s=re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip', s)
          p.write_text(s)
          PY

      - name: Apply VOSTOK native compatibility
        working-directory: client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Jni source/jni/util/CJavaWrapper.cpp')
          p.write_text(p.read_text().replace('141.95.190.142', '192.168.0.22').replace('1187', '7777'))
          p=Path('Jni source/jni/net/netrpc.cpp')
          p.write_text(p.read_text().replace('Connected to {B9C9BF}%.64s', 'Connected to VOSTOK DEV {B9C9BF}%.64s'))
          p=Path('Jni source/jni/Android.mk')
          p.write_text(p.read_text().replace('/vendor/RakNet/', '/vendor/raknet/'))
          PY
          ln -sf chatwindow.h "Jni source/jni/chatWindow.h"

      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;34.0.0"

      - name: Install legacy NDK r16b compatibility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libncurses5 libtinfo5
          curl -L --fail --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q /tmp/ndk.zip -d $HOME
          echo "NDK16=$HOME/android-ndk-r16b" >> $GITHUB_ENV

      - name: Build JNI libsamp.so
        working-directory: client/Jni source
        run: |
          rm -rf obj libs
          "$NDK16/ndk-build" -j2 NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
          test -f libs/armeabi-v7a/libsamp.so
          cp -f libs/armeabi-v7a/libsamp.so ../app/src/main/jniLibs/armeabi-v7a/libsamp.so
          sha256sum libs/armeabi-v7a/libsamp.so

      - name: Build APK
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Verify VOSTOK package and launcher resource
        working-directory: client
        run: |
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/vostok_badging.txt
          grep -q "package: name='com.vostok.roleplay'" /tmp/vostok_badging.txt
          grep -q "application-label:'VOSTOK'" /tmp/vostok_badging.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'vostok_launcher_reference.jpg'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK-client-debug
          path: client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload source-built libsamp
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK-libsamp-armeabi-v7a
          path: client/Jni source/libs/armeabi-v7a/libsamp.so
          if-no-files-found: error
