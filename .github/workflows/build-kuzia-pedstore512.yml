name: Build Kuzia + Gold Crime PedStore 512

on:
  push:
    branches:
      - experiment-kuzia-goldcrime-pedstore512
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout VOSTOK experiment branch
        uses: actions/checkout@v4

      - name: Download exact Run 15 patched source
        uses: actions/download-artifact@v4
        with:
          name: VOSTOK_KUZIA_CRIME_MODELCD_SOURCE
          path: kuzia
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: prokenar-cmd/VOSTOK-CLIENT
          run-id: 35083372752

      - name: Verify Run 15 source baseline
        shell: bash
        run: |
          set -euxo pipefail
          test -f kuzia/VOSTOK_SOURCE_STATE.md
          test -f kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'VOSTOK ModelCD:' kuzia/app/src/main/cpp/samp/game/Streaming.cpp
          grep -nF 'VOSTOK CRIME bridge' kuzia/app/src/main/cpp/samp/game/hooks.cpp
          grep -nF '/storage/emulated/0/GTA_CRIME_TEST/' kuzia/app/src/main/cpp/samp/game/hooks.cpp

      - name: Expand ped model store to 512
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          h = Path('kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h')
          s = h.read_text(encoding='utf-8')
          old = 'static constexpr int32_t NUM_PED_MODEL_INFOS = 315;'
          new = 'static constexpr int32_t NUM_PED_MODEL_INFOS = 512;'
          if old not in s:
              raise SystemExit('Expected 315-entry ped store declaration not found')
          h.write_text(s.replace(old, new, 1), encoding='utf-8')

          cpp = Path('kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp')
          s = cpp.read_text(encoding='utf-8')
          old_block = '''CPedModelInfo* CModelInfo::AddPedModel(int index)\n{\n\n    auto& pInfo = CModelInfo::ms_pedModelInfoStore.AddItem();\n'''
          new_block = '''CPedModelInfo* CModelInfo::AddPedModel(int index)\n{\n    const auto slot = CModelInfo::ms_pedModelInfoStore.m_nCount;\n    if (slot >= 315) {\n        Log("VOSTOK PedStore extended: slot=%zu model=%d capacity=%d",\n            slot, index, CModelInfo::NUM_PED_MODEL_INFOS);\n    }\n    if (slot >= CModelInfo::NUM_PED_MODEL_INFOS) {\n        Log("VOSTOK PedStore OVERFLOW: slot=%zu model=%d capacity=%d",\n            slot, index, CModelInfo::NUM_PED_MODEL_INFOS);\n        return nullptr;\n    }\n\n    auto& pInfo = CModelInfo::ms_pedModelInfoStore.AddItem();\n'''
          if old_block not in s:
              raise SystemExit('AddPedModel insertion point not found')
          cpp.write_text(s.replace(old_block, new_block, 1), encoding='utf-8')
          PY

          grep -nF 'NUM_PED_MODEL_INFOS = 512' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'VOSTOK PedStore extended' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp

          cat >> kuzia/VOSTOK_SOURCE_STATE.md <<'EOF'

          ## PedStore 512 experiment
          Runtime evidence from Run 15 / CRIME SAMP/peds.ide:
          - CRIME SAMP/peds.ide contains 365 PED entries.
          - Kuzia upstream ped model store capacity is 315.
          - Entries 1..311 are standard IDs; entries 312..365 are CRIME custom PEDs.
          - Store overflow begins at slot 315 (the 316th PED, model 4104) and overruns 50 CPedModelInfo objects.
          - Run 15 fixed the earlier ModelCD 0x1 crash, then crashed later in CModelInfo::GetModelInfo while loading weapons.col, consistent with prior memory corruption.

          This experiment changes only NUM_PED_MODEL_INFOS from 315 to 512 and adds diagnostic logging for slots >=315.
          ModelCD fix, player PVR bridge, unified cache root and all prior confirmed patches remain unchanged.
          This is NOT a MASTER promotion and requires device smoke.
          EOF

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK_KUZIA_CRIME_PEDSTORE512_SOURCE
          path: kuzia
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build PedStore-512 APK
        working-directory: kuzia
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          rm -rf app/.cxx app/build/intermediates/cxx app/build/intermediates/merged_native_libs
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --rerun-tasks

      - name: Verify rebuilt libsamp
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find kuzia/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          unzip -p "$APK" lib/arm64-v8a/libsamp.so > /tmp/libsamp.so
          test -s /tmp/libsamp.so

          strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA_CRIME_TEST/' | head -20
          strings /tmp/libsamp.so | grep -F 'VOSTOK CRIME bridge: player.dxt.tmb -> player.pvr.tmb'
          strings /tmp/libsamp.so | grep -F 'VOSTOK ModelCD: model='
          strings /tmp/libsamp.so | grep -F 'VOSTOK PedStore extended:'

          if strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA/'; then
            echo 'ERROR: rebuilt libsamp.so still contains legacy /storage/emulated/0/GTA/'
            exit 1
          fi

          sha256sum /tmp/libsamp.so "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_PEDSTORE512_FIX
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload rebuilt libsamp
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_PEDSTORE512_FIX_LIBSAMP
          path: /tmp/libsamp.so
          if-no-files-found: error
          retention-days: 7
