name: Build Kuzia + Gold Crime VehicleStore 1024

on:
  push:
    branches:
      - experiment-kuzia-goldcrime-vehiclestore1024
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout VOSTOK experiment branch
        uses: actions/checkout@v4

      - name: Download exact Run 16 patched source
        uses: actions/download-artifact@v4
        with:
          name: VOSTOK_KUZIA_CRIME_PEDSTORE512_SOURCE
          path: kuzia
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: prokenar-cmd/VOSTOK-CLIENT
          run-id: 35085482488

      - name: Verify Run 16 source baseline
        shell: bash
        run: |
          set -euxo pipefail
          test -f kuzia/VOSTOK_SOURCE_STATE.md
          test -f kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'NUM_PED_MODEL_INFOS = 512' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'VOSTOK PedStore extended:' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp
          grep -nF 'VOSTOK ModelCD:' kuzia/app/src/main/cpp/samp/game/Streaming.cpp
          grep -nF 'VOSTOK CRIME bridge' kuzia/app/src/main/cpp/samp/game/hooks.cpp
          grep -nF '/storage/emulated/0/GTA_CRIME_TEST/' kuzia/app/src/main/cpp/samp/game/hooks.cpp

      - name: Expand vehicle model store to 1024
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          h = Path('kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h')
          s = h.read_text(encoding='utf-8')
          old = 'static constexpr int32 NUM_VEHICLE_MODEL_INFOS = 270;'
          new = 'static constexpr int32 NUM_VEHICLE_MODEL_INFOS = 1024;'
          if old not in s:
              raise SystemExit('Expected 270-entry vehicle store declaration not found')
          h.write_text(s.replace(old, new, 1), encoding='utf-8')

          cpp = Path('kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp')
          s = cpp.read_text(encoding='utf-8')
          old_block = '''CVehicleModelInfo* CModelInfo::AddVehicleModel(int index)\n{\n    auto& pInfo = CModelInfo::ms_vehicleModelInfoStore.AddItem();\n'''
          new_block = '''CVehicleModelInfo* CModelInfo::AddVehicleModel(int index)\n{\n    const auto slot = CModelInfo::ms_vehicleModelInfoStore.m_nCount;\n    if (slot >= 270) {\n        Log("VOSTOK VehicleStore extended: slot=%zu model=%d capacity=%d",\n            slot, index, CModelInfo::NUM_VEHICLE_MODEL_INFOS);\n    }\n    if (slot >= CModelInfo::NUM_VEHICLE_MODEL_INFOS) {\n        Log("VOSTOK VehicleStore OVERFLOW: slot=%zu model=%d capacity=%d",\n            slot, index, CModelInfo::NUM_VEHICLE_MODEL_INFOS);\n        return nullptr;\n    }\n\n    auto& pInfo = CModelInfo::ms_vehicleModelInfoStore.AddItem();\n'''
          if old_block not in s:
              raise SystemExit('AddVehicleModel insertion point not found')
          cpp.write_text(s.replace(old_block, new_block, 1), encoding='utf-8')
          PY

          grep -nF 'NUM_VEHICLE_MODEL_INFOS = 1024' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.h
          grep -nF 'VOSTOK VehicleStore extended:' kuzia/app/src/main/cpp/samp/game/Models/ModelInfo.cpp

          cat >> kuzia/VOSTOK_SOURCE_STATE.md <<'EOF'

          ## VehicleStore 1024 experiment
          Runtime evidence from Run 16 / CRIME SAMP/vehicles.ide:
          - CRIME SAMP/vehicles.ide contains 635 vehicle entries.
          - Kuzia upstream vehicle model store capacity is 270.
          - VehicleStore therefore overruns by 365 CVehicleModelInfo objects on the full CRIME file.
          - Run 16 confirmed PedStore 512 works for CRIME custom peds, but the client still crashes later in CModelInfo::GetModelInfo while loading models/coll/weapons.col.
          - weapons.col, default.ide and default.dat match the old VOSTOK/BlackRussia copies byte-for-byte, so the collision file itself is not the primary suspect.

          This experiment changes only NUM_VEHICLE_MODEL_INFOS from 270 to 1024 and adds diagnostic/overflow logging for slots >=270.
          PedStore 512, ModelCD fix, player PVR bridge, unified cache root and prior confirmed patches remain unchanged.
          This is NOT a MASTER promotion and requires device smoke.
          EOF

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: VOSTOK_KUZIA_CRIME_VEHICLESTORE1024_SOURCE
          path: kuzia
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: kuzia/**/*.gradle*

      - name: Install Android 36, NDK 26.2 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build VehicleStore-1024 APK
        working-directory: kuzia
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          rm -rf app/.cxx app/build/intermediates/cxx app/build/intermediates/merged_native_libs
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --rerun-tasks

      - name: Verify rebuilt libsamp
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find kuzia/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          unzip -p "$APK" lib/arm64-v8a/libsamp.so > /tmp/libsamp.so
          test -s /tmp/libsamp.so

          strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA_CRIME_TEST/' | head -20
          strings /tmp/libsamp.so | grep -F 'VOSTOK CRIME bridge: player.dxt.tmb -> player.pvr.tmb'
          strings /tmp/libsamp.so | grep -F 'VOSTOK ModelCD: model='
          strings /tmp/libsamp.so | grep -F 'VOSTOK PedStore extended:'
          strings /tmp/libsamp.so | grep -F 'VOSTOK VehicleStore extended:'

          if strings /tmp/libsamp.so | grep -F '/storage/emulated/0/GTA/'; then
            echo 'ERROR: rebuilt libsamp.so still contains legacy /storage/emulated/0/GTA/'
            exit 1
          fi

          sha256sum /tmp/libsamp.so "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_VEHICLESTORE1024_FIX
          path: kuzia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload rebuilt libsamp
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUZIA_GOLDCRIME_VEHICLESTORE1024_FIX_LIBSAMP
          path: /tmp/libsamp.so
          if-no-files-found: error
          retention-days: 7
