name: Build John Parad1st MPDATA Stage4

on:
  push:
    branches:
      - experiment-john-paradist-boot
    paths:
      - '.github/workflows/build-john-paradist-stage4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned John source
        uses: actions/checkout@v4
        with:
          repository: JohnPeriaX/samp-mobile-2.11.311
          ref: 0df908fccfc26ac3ef54e004504b5b1f122362b1
          path: john
          persist-credentials: false

      - name: Checkout VOSTOK experiment scripts
        uses: actions/checkout@v4
        with:
          repository: prokenar-cmd/VOSTOK-CLIENT
          ref: experiment-john-paradist-boot
          path: vostok
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: john/**/*.gradle*

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Reapply verified STAGE3 base patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          wf = Path('vostok/.github/workflows/build-john-paradist-stage3.yml').read_text(encoding='utf-8')
          m = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY", wf, flags=re.S)
          if not m:
              raise SystemExit('cannot extract STAGE3 python patch')
          script = textwrap.dedent(m.group(1))
          Path('/tmp/stage3_patch.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/stage3_patch.py

      - name: Patch Parad1st multiplayer data redirects
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hooks = Path('john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp')
          h = hooks.read_text(encoding='utf-8')

          old = '''    if (strstr(r1, "emulated") != NULL)\n    {\n        // text contains "emulated"\n        sprintf(path, "%s", r1);\n    }\n    else\n    {\n        sprintf(path, "%s%s", g_pszStorage, r1);\n    }'''
          new = '''    const char* vostokMpOverride = nullptr;\n    if (strstr(r1, "data/script/mainv1.scm") != nullptr)\n        vostokMpOverride = "SAMP/main.scm";\n    else if (strstr(r1, "data/script/scriptv1.img") != nullptr)\n        vostokMpOverride = "SAMP/script.img";\n    else if (strstr(r1, "data/peds.ide") != nullptr)\n        vostokMpOverride = "SAMP/peds.ide";\n    else if (strstr(r1, "data/vehicles.ide") != nullptr)\n        vostokMpOverride = "SAMP/vehicles.ide";\n    else if (strstr(r1, "data/gta.dat") != nullptr)\n        vostokMpOverride = "SAMP/gta.dat";\n\n    if (vostokMpOverride != nullptr)\n    {\n        snprintf(path, sizeof(path), "%s%s", g_pszStorage, vostokMpOverride);\n        FLog("VOSTOK STAGE4 MPDATA: %s -> %s", r1, path);\n    }\n    else if (strstr(r1, "emulated") != NULL)\n    {\n        sprintf(path, "%s", r1);\n    }\n    else\n    {\n        sprintf(path, "%s%s", g_pszStorage, r1);\n    }'''
          if old not in h:
              raise SystemExit('NvFOpen generic path block not found after STAGE3 patch')
          h = h.replace(old, new, 1)

          # Targeted multiplayer files must never silently fall back to stock GTA.
          old_miss = '''    else\n    {\n        free(st);\n        FLog("VOSTOK STAGE3 FILEIO: loose miss -> original NvFOpen: %s", r1);\n        if (NvFOpen_orig) return NvFOpen_orig(r1);\n        FLog("VOSTOK STAGE3 FILEIO: ERROR original NvFOpen unavailable: %s", r1);\n        return nullptr;\n    }'''
          new_miss = '''    else\n    {\n        free(st);\n        if (vostokMpOverride != nullptr)\n        {\n            FLog("VOSTOK STAGE4 MPDATA: REQUIRED FILE MISSING: %s", path);\n            return nullptr;\n        }\n        FLog("VOSTOK STAGE4 FILEIO: loose miss -> original NvFOpen: %s", r1);\n        if (NvFOpen_orig) return NvFOpen_orig(r1);\n        FLog("VOSTOK STAGE4 FILEIO: ERROR original NvFOpen unavailable: %s", r1);\n        return nullptr;\n    }'''
          if old_miss not in h:
              raise SystemExit('STAGE3 NvFOpen miss block not found')
          h = h.replace(old_miss, new_miss, 1)

          # Rename stage markers so the phone log cannot be confused with older appended attempts.
          h = h.replace('VOSTOK STAGE3:', 'VOSTOK STAGE4:')
          h = h.replace('VOSTOK STAGE3 FILEIO:', 'VOSTOK STAGE4 FILEIO:')
          hooks.write_text(h, encoding='utf-8')

          for rel in [
              'john/app/src/main/cpp/multiplayer/samp/main.cpp',
              'john/app/src/main/cpp/multiplayer/samp/Multiplayer/Multiplayer.cpp',
              'john/app/src/main/cpp/multiplayer/samp/Network/Network.cpp',
              'john/app/src/main/cpp/multiplayer/samp/Network/RPCMgr.cpp',
          ]:
              p = Path(rel)
              t = p.read_text(encoding='utf-8').replace('VOSTOK STAGE3:', 'VOSTOK STAGE4:')
              p.write_text(t, encoding='utf-8')
          PY

      - name: Verify Stage4 profile
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'VOSTOK STAGE4 MPDATA:' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -q 'SAMP/main.scm' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -q 'SAMP/script.img' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -q 'SAMP/peds.ide' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -q 'SAMP/vehicles.ide' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -q 'SAMP/gta.dat' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          ! grep -q 'SAMP/handling.cfg' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          ! grep -q 'SAMP/weapon.dat' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -q 'VOSTOK STAGE4: invoking ORIGINAL StartGameScreen::OnNewGameCheck' john/app/src/main/cpp/multiplayer/samp/hooks/Hooks.cpp
          grep -q 'pSettings->Get().szHost' john/app/src/main/cpp/multiplayer/samp/main.cpp
          test "$(sha256sum john/app/src/main/jniLibs/arm64-v8a/libGame.so | awk '{print toupper($1)}')" = "4C6A7445E30B27AFDDA781302E4DB9BAC89C28FC1181B68B1EEF16F84D6A282E"

      - name: Remove duplicate packaged native libs
        shell: bash
        run: |
          set -euxo pipefail
          rm -f john/app/src/main/jniLibs/arm64-v8a/libbass.so john/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so john/app/src/main/jniLibs/arm64-v8a/libGlossHook.so

      - name: Build APK
        working-directory: john
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Validate and stage APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find john/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          rm -rf /tmp/john-apk
          mkdir -p /tmp/john-apk
          unzip -q "$APK" -d /tmp/john-apk
          test -f /tmp/john-apk/lib/arm64-v8a/libsamp.so
          test -f /tmp/john-apk/lib/arm64-v8a/libGame.so
          test ! -d /tmp/john-apk/lib/armeabi-v7a
          cp "$APK" JOHN_PARADIST_STAGE4_MPDATA_ARM64.apk
          sha256sum JOHN_PARADIST_STAGE4_MPDATA_ARM64.apk > JOHN_PARADIST_STAGE4_MPDATA_ARM64.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOHN-PARADIST-STAGE4-MPDATA-ARM64
          path: |
            JOHN_PARADIST_STAGE4_MPDATA_ARM64.apk
            JOHN_PARADIST_STAGE4_MPDATA_ARM64.apk.sha256
          if-no-files-found: error
          retention-days: 14
